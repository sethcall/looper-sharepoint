# Push a tag `v<version>` (matching the workspace version, e.g. v0.2.0, or v0.2.0-rc.1 for a pre-release) to build the
# app, sign it as team WDTD322L33, notarize and staple it, and attach the .dmg to a GitHub release.
#
# The signing certificate and the notarization key are secrets of the `release` environment, which only `v*` tags
# can use: see docs/packaging.md, "Releases from GitHub". The signing itself is scripts/package-macos.sh, which
# refuses any other team.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The packaging build folder and the Tauri CLI, as last saved by CI's `package` job on main. A tag's run can only
      # read caches saved on main or on that same tag, so releases only restore them and never save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package
          workspaces: ". -> target/package"
          cache-bin: false
          save-if: false

      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="looper-sharepoint-tray"))')
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }

      # Keep the version the same here and in ci.yml.
      - name: Restore the Tauri CLI
        id: tauri-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.12.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install the Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.1 --locked

      - name: Import the signing certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -t cert -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/package-macos.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A full release is marked latest, so .../releases/latest/download/Looper-SharePoint.dmg always gets it.
          kind="--latest"
          case "$GITHUB_REF_NAME" in *-*) kind="--prerelease --latest=false" ;; esac
          dmg=$(ls dist/*.dmg)
          cp "$dmg" dist/Looper-SharePoint.dmg
          gh release create "$GITHUB_REF_NAME" "$dmg" dist/Looper-SharePoint.dmg --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $kind

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
