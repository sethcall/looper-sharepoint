[package]
name = "looper-sharepoint-latency-bench"
description = "Measures remote-change to local-file latency against a running looper-sharepoint host."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
looper-sharepoint-engine = { version = "0.1.0", path = "../../crates/looper-sharepoint-engine" }
looper-sharepoint-ipc = { version = "0.1.0", path = "../../crates/looper-sharepoint-ipc" }
tokio = { version = "1.53.2", features = ["full"] }
