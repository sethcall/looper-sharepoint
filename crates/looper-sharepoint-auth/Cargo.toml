[package]
name = "looper-sharepoint-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Packaged builds: tokens only in the OS keychain. Without it (development builds), tokens go in owner-only files
# so rebuilds don't trigger keychain prompts. See src/store.rs.
release = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
dirs = "7.0.0"
getrandom = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "macros", "sync"] }
tracing = "0.1.44"
url = "2.5.8"
