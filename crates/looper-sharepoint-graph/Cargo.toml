[package]
name = "looper-sharepoint-graph"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
looper-sharepoint-auth = { version = "0.1.0", path = "../looper-sharepoint-auth" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "net", "time", "sync"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "test-util"] }
