[package]
name = "looper-sharepoint-engine"
description = "Embeddable SharePoint sync service: engine, scheduler, status and history. No UI, no daemonizing."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Packaged builds: sign-in tokens only in the OS keychain (see looper-sharepoint-auth's `release`).
release = ["looper-sharepoint-auth/release"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
fastrand = "2.5.0"
filetime = "0.2.29"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
looper-sharepoint-auth = { version = "0.1.0", path = "../looper-sharepoint-auth" }
looper-sharepoint-core = { version = "0.1.0", path = "../looper-sharepoint-core" }
looper-sharepoint-graph = { version = "0.1.0", path = "../looper-sharepoint-graph" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
gethostname = "1.1.0"
notify = "8"
url = "2.5.8"
dirs = "7.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "rt-multi-thread"] }
