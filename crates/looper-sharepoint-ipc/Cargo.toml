[package]
name = "looper-sharepoint-ipc"
description = "Optional local control socket for a looper-sharepoint host (status, trigger, sync, events)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
interprocess = { version = "2.4.5", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
looper-sharepoint-engine = { version = "0.1.0", path = "../looper-sharepoint-engine" }
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "io-util", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
