<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looper SharePoint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="headline">
      <span id="health" class="dot"></span>
      <div>
        <h1 id="headline">Loading…</h1>
        <div id="account" class="muted"></div>
      </div>
    </div>
    <div class="actions">
      <button id="add" type="button" class="secondary" hidden>Add folder…</button>
      <button id="sync-all" type="button">Sync now</button>
      <button id="pause" type="button" class="secondary">Pause</button>
      <button id="config" type="button" class="secondary">Config file</button>
    </div>
  </header>

  <div id="mode" class="mode" hidden></div>

  <div id="banner" class="banner" hidden></div>

  <div id="notice" class="notice" hidden></div>

  <main>
    <section>
      <h2>Libraries</h2>
      <div id="libraries"></div>
    </section>

    <section>
      <h2>Recent runs</h2>
      <table id="runs">
        <thead><tr><th>When</th><th>Library</th><th>Trigger</th><th>Result</th><th>Details</th><th class="num">Took</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="no-runs" class="muted" hidden>No runs yet.</p>
    </section>
  </main>

  <footer class="muted">
    <span id="stats"></span>
    <span id="cli-status"></span>
    <span id="config-path"></span>
  </footer>

  <dialog id="ob-dialog">
    <form method="dialog" id="ob-form">
      <h3 id="ob-title">Set up</h3>
      <div id="ob-body"></div>
      <p id="ob-msg" class="cli-msg" hidden></p>
      <div class="dialog-actions" id="ob-actions"></div>
    </form>
  </dialog>

  <dialog id="cli-dialog">
    <form method="dialog" id="cli-form">
      <h3 id="cli-title">Install the command line tool</h3>
      <div id="cli-body"></div>
      <p id="cli-msg" class="cli-msg" hidden></p>
      <div class="dialog-actions" id="cli-actions"></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
